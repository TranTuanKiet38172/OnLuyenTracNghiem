  /* ③ Viết lời giải */
  async function jobExplain(ctx,opt){
    var work=aiPre(ctx,V.raw),n=parse(work).items.length,done=0,skip=0,fail=0,i;
    if(!n)throw new Error('Chưa đọc được câu nào. Hãy chạy bước ① hoặc kiểm tra đề phải bắt đầu từ "Câu 1".');

        if(!opt.redo&&q.st.every(function(s){return s[2]&&plain(s[2]).length>=6})){ctx.log(tag+': đã có giải thích từng ý, bỏ qua.');skip++;continue}
        var tt0=Date.now(),ttx=aiQText(work.split('\n'),x);
        var sysT='You are a Vietnamese teacher. You are given a True/False exam question with four statements a), b), c), d) and the correct verdict of each. For EACH statement write a short explanation in Vietnamese (1 or 2 sentences, plain text, no markdown, no line breaks) that states the underlying knowledge, rule or calculation. Do NOT use templates such as "Ý a đúng vì" or "Ý b sai vì" or "Phát biểu này đúng/sai", do not mention the letter, do not repeat the statement. Fields a, b, c, d hold the explanation of statements a, b, c, d. '+AIJ;
        ctx.log(tag+': đang viết giải thích từng ý…');
        var outT=await aiAskJSON(ctx,tag,{system:sysT,user:ttx+'\n\nCORRECT ANSWER: '+aiAnswerText(x),schema:AI_TFEX,think:opt.think,signal:ctx.signal});
        var notes=outT?['a','b','c','d'].map(function(z){return String(outT[z]||'').replace(/\s*\n\s*/g,' ').replace(/\*\*/g,'').replace(/\s*\/\/\s*/g,' ').replace(/^\s*=>\s*/,'').trim().slice(0,400)}):null;
        if(!notes||notes.some(function(n){return !n})){fail++;ctx.log(tag+': không nhận đủ giải thích 4 ý, bỏ qua.','bad');continue}
        work=aiEdit(work,function(a){for(var j=0;j<4;j++){var end=j<3?x.opts[j+1].ln-1:(x.arLn?x.arLn-1:x.last);while(end>x.opts[j].ln&&!String(a[end-1]||'').trim())end--;
          a[end-1]=String(a[end-1]).replace(/\s+\/\/\s.*$/,'').replace(/\s+$/,'')+' // '+notes[j]}});
        done++;ctx.setResult(work,done);ctx.log(tag+': đã thêm giải thích 4 ý ('+aiSecs(tt0)+')','ok');ctx.log('     ↳ a) '+notes[0].slice(0,160));
        continue}
      if(plain(q.e||'').length>=12&&!opt.redo){ctx.log(tag+': đã có lời giải, bỏ qua.');skip++;continue}
      var t0=Date.now(),txt=aiQText(work.split('\n'),x);
      var sys='You are a Vietnamese teacher. You are given an exam question and its CORRECT answer. Write a short explanation in Vietnamese of why that answer is correct: at most 3 short sentences, plain text, a single paragraph, no markdown, no line breaks, do not repeat the question. '+AIJ;
      ctx.log(tag+': đang viết lời giải…');
      var out=await aiAskJSON(ctx,tag,{system:sys,user:txt+'\n\nCORRECT ANSWER: '+aiAnswerText(x),schema:AI_EX,think:opt.think,signal:ctx.signal});
      var ex=out&&String(out.explanation||'').replace(/\s*\n\s*/g,' ').replace(/^\s*=>\s*/,'').replace(/\*\*/g,'').trim().slice(0,700);
      if(!ex){fail++;ctx.log(tag+': không nhận được lời giải, bỏ qua.','bad');continue}
      work=aiEdit(work,function(a){var s=q.t==='sa'?(x.arLn?x.arLn+1:x.last+1):(x.arLn||x.last+1),e=x.arLn?x.last:s-1;a.splice(s-1,Math.max(0,e-s+1),'=> '+ex)});

  /* ① Sắp xếp đề: chỉ chỉnh định dạng, không giải, không viết lời giải */
  var AIS=['You reformat Vietnamese exam text into a strict plain-text syntax. You ONLY fix layout. You never solve questions and never write explanations. Output ONLY the reformatted text: no commentary, no markdown code fences.','',
    'SYNTAX','- Each question starts on its own line: "Câu N. <question text>", N = 1, 2, 3... in order. Always use the word "Câu".',
    '- Multiple choice: exactly 4 option lines "a. ...", "b. ...", "c. ...", "d. ...".',
    '- True/False (a list of statements judged Đúng or Sai): exactly 4 lines "a) ...", "b) ...", "c) ...", "d) ...".',
    '- Short answer (no options): just the question text, no option lines.','',
    'RULES','- Keep the original wording, numbers and formulas ($x^2$ stays unchanged). Do not paraphrase, translate, shorten or reorder anything.',
    '- Remove noise: page headers/footers, "Trang x", score notes, section titles like "PHẦN I", general instructions between questions.',
    '- Difficulty tags: if the source already has a level tag [M1], [M2] or [M3], keep it unchanged right after "Câu N." (e.g. "Câu 3. [M2] ..."). If the source labels levels with words (Nhận biết / NB = [M1]; Thông hiểu / TH = [M2]; Vận dụng / VD / Vận dụng cao / VDC = [M3]), convert them to the tag and delete the original label. Do NOT invent a level when the source has none.',
    '- Do NOT invent answers. Do NOT write "=>" lines and do NOT add "*" yourself. Only if the source already marks the correct option (an existing "*" before the letter, or an answer key such as "Đáp án: B"), put "*" directly before the letter of that option line, e.g. "*b. text". Never put "*" on the question line.',
    '- If the source already has explanation lines starting with "=>", keep them unchanged after the options.','',
    'EXAMPLE OUTPUT','Câu 1. Thủ đô của Việt Nam là gì?','a. Hà Nội','b. Huế','c. Đà Nẵng','d. Hải Phòng','','Câu 2. Cho các phát biểu sau:','a) Trái Đất quay quanh Mặt Trời.','b) Mặt Trời quay quanh Trái Đất.','c) Trái Đất có một vệ tinh tự nhiên.','d) Mặt Trăng lớn hơn Trái Đất.','','Câu 3. Tính x biết 3x = -369.'].join('\n');
  function aiStructErrs(t){var r=parse(t),e=[];if(!r.items.length)e.push('No "Câu 1." found.');if(r.mix)e.push('Mixed "Câu" and "Bài" headings; use only "Câu".');
    r.items.forEach(function(x,i){x.errs.forEach(function(m){if(/^Chưa chọn|thiếu đáp án|^Đáp án/.test(m))return;e.push('Câu '+(i+1)+': '+m)});
      if(/\*\s*[a-dA-D][.)]\s/.test(plain(x.q.s)))e.push('Câu '+(i+1)+': có đáp án bị dính ở cuối dòng đề.');
      if(x.q.t==='sa'&&(plain(x.q.s).match(/(^|\s)[a-dA-D][.)]\s/g)||[]).length>=3)e.push('Câu '+(i+1)+': các phương án a, b, c, d đang nằm chung dòng với đề, phải tách mỗi phương án một dòng.')});return e}
  function aiFixMarks(t){var pend=null;return t.split('\n').map(function(ln){
    var m=ln.match(/^(\s*c[aâ]u\s*\d+.*?)\s*\*\s*([a-dA-D])[.)]\s.*$/i);
    if(m){pend=m[2].toLowerCase();return m[1].replace(/\s+$/,'')}
    if(/^\s*c[aâ]u\s*\d+/i.test(ln)){pend=null;return ln}
    var o=ln.match(/^\s*\*?\s*\(?([a-dA-D])[.)]/);
    if(o&&pend&&o[1].toLowerCase()===pend){pend=null;return ln.replace(/^(\s*)\*?\s*/,'$1*')}
    return ln}).join('\n')}
  function aiClean(t){t=String(t||'').replace(/^\s*```[a-z]*\s*$/gim,'').replace(/<think>[\s\S]*?<\/think>/gi,'');
    var ls=t.split('\n'),i=ls.findIndex(function(l){return /^\s*c[aâ]u\s*\d+/i.test(l)});return aiFixMarks((i>=0?ls.slice(i):ls).join('\n').trim())}
  /* Gỡ đáp án bị dính ở cuối dòng đề (vd. "...là gì? *b. 3x² - 6x + 2"), gắn * đúng phương án. Chạy đầu mỗi bước. */
  function aiPre(ctx,text){var f=aiFixMarks(text);if(f===text)return text;var n=0,a=text.split('\n'),b=f.split('\n');
    a.forEach(function(l,i){if(/^\s*c[aâ]u\s*\d+/i.test(l)&&l!==b[i])n++});
    ctx.log('Đã gỡ đáp án/dấu * bị dính ở cuối dòng đề của '+n+' câu (và đặt lại * đúng phương án).','warn');ctx.setResult(f,n);return f}
  async function jobStructure(ctx){
    var raw=aiPre(ctx,V.raw.replace(/\r\n?/g,'\n')),cfg=OTN.ollamaCfg(),r0=parse(raw),pre=aiStructErrs(raw),i;
    if(r0.items.length&&!pre.length){ctx.log('Đề đã đúng cú pháp ('+r0.items.length+' câu) — không cần nhờ AI sắp xếp lại. Hãy chạy bước ② hoặc ③.','ok');ctx.progress(1,1,'Xong');return}

    ctx.log('Đề dài '+raw.length+' ký tự, chia thành '+chunks.length+' phần.'+(r0.items.length?' Đề hiện có '+pre.length+' lỗi cú pháp.':' Chưa nhận ra câu nào theo cú pháp.'));

      if(errs.length){errs.slice(0,3).forEach(function(m){ctx.log('     ↳ '+m,'warn')});ctx.log(tag+': nhờ AI sửa lại…');t0=Date.now();
        var fx=aiClean(await OTN.ollamaAsk({system:AIS,messages:[{role:'user',content:u},{role:'assistant',content:out},{role:'user',content:'The result still has these format problems:\n'+errs.slice(0,12).join('\n')+'\nOutput the COMPLETE corrected text again, following the syntax exactly. Output only the text.'}],signal:ctx.signal})),e2=aiStructErrs(fx);
        if(fx&&e2.length<=errs.length){out=fx;ctx.log(tag+': sau khi sửa còn '+e2.length+' lỗi ('+aiSecs(t0)+').',e2.length?'warn':'ok')}else ctx.log(tag+': bản sửa không tốt hơn, giữ bản đầu.','warn')}

  /* Hộp thoại chạy: thanh tiến độ + nhật ký + Dừng / Dùng kết quả */
  function aiRun(title,job,flag){
    if(!V.raw.trim()){note('Chưa có đề','Hãy dán đề vào ô trước rồi bấm lại.');return}
    var ac=new AbortController(),t0=Date.now(),res=null,logs=[],timer=null,running=true;
    var logBox=h('div',{style:'font:12.5px/1.55 ui-monospace,Consolas,monospace;background:var(--sf2);border-radius:10px;padding:10px;height:min(46vh,340px);overflow:auto;overflow-wrap:anywhere'}),
      stat=h('div',{class:'small',role:'status'},'Đang bắt đầu…'),bar=h('progress',{max:100,value:0,style:'width:100%'}),stage='Đang chạy';

      use=h('button',{class:'btn pri',style:'display:none',onclick:function(){ta.value=res.text;V.raw=res.text;V.ai=Math.max(V.ai||0,flag);clearInterval(timer);m.remove();pv()}},'Dùng kết quả'),
      cp=h('button',{class:'btn ghost',onclick:function(){var t=logs.join('\n');try{navigator.clipboard.writeText(t).then(function(){log('Đã sao chép nhật ký.')},function(){log('Không sao chép được (trình duyệt chặn).','warn')})}catch(e){log('Không sao chép được (trình duyệt chặn).','warn')}}},'Sao chép nhật ký');
    m.appendChild(h('div',{class:'box',style:'max-width:720px'},h('h3',null,title),bar,stat,logBox,h('div',{class:'row',style:'justify-content:flex-end'},cp,stop,use,h('button',{class:'btn ghost',onclick:close},'Đóng'))));
    document.body.appendChild(m);timer=setInterval(tick,1000);tick();
    var ctx={signal:ac.signal,log:log,

  var aiBox=null;
  if(OTN.ollamaOn()){var oThink=h('input',{type:'checkbox'}),oRedoA=h('input',{type:'checkbox'}),oRedoE=h('input',{type:'checkbox'});
    var lab=function(cb,t){return h('label',{class:'small row',style:'gap:6px'},cb,t)};
    aiBox=h('div',{class:'stack',style:'gap:8px'},h('b',null,'Trợ lý AI (Ollama) — làm từng bước'),
      h('div',{class:'row'},

        h('button',{class:'btn sm',type:'button',onclick:function(){aiRun('③ Viết lời giải',function(c){return jobExplain(c,{redo:oRedoE.checked,think:oThink.checked})},2)}},'③ Viết lời giải')),
      lab(oRedoA,'② Tính lại cả câu đã có đáp án'),lab(oRedoE,'③ Viết lại cả câu đã có lời giải'),lab(oThink,'Chế độ suy nghĩ kỹ (chậm hơn nhiều, chính xác hơn) — dùng cho ② và ③'),
      h('div',{class:'hint'},'Chỉ có trên máy tính. ① chỉ sắp xếp định dạng (không giải). ② giải từng câu và tự thêm dấu *. ③ viết lời giải ngắn cho câu đã có đáp án (câu Đúng/Sai: giải thích riêng từng ý a, b, c, d, không lặp lại \"ý này đúng/sai vì\"). Mỗi bước hiện nhật ký trực tiếp và chỉ áp dụng khi bạn bấm "Dùng kết quả". Mô hình: '+OTN.ollamaInfo()+'.'))}
  /*AI-END*/
  left.appendChild(ta);if(aiBox)left.appendChild(aiBox);
  left.appendChild(h('details',null,h('summary',null,'Cú pháp nhập đề'),h('div',{class:'small stack',style:'margin-top:6px'},
    h('div',null,'Đọc từ "Câu 1" (hoặc "Bài 1"); chữ trước đó bị bỏ qua. Tiêu đề câu dùng "Câu N" hoặc "Bài N", không được trộn hai kiểu; khi làm bài luôn hiện là Câu 1, Câu 2…'),
    h('div',null,h('b',null,'4 phương án: '),'4 dòng a. b. c. d., đặt * trước đáp án đúng.'),
    h('div',null,h('b',null,'Đúng/Sai: '),'4 dòng a) b) c) d); * trước ý đúng (được nhiều *).'),
    h('div',null,h('b',null,'Trả lời ngắn: '),'không có phương án; dòng "=>" đầu tiên là đáp án (đúng 4 ký tự, chỉ số và dấu -).'),
    h('div',null,h('b',null,'Lời giải (tùy chọn): '),'các dòng bắt đầu bằng "=>", giải thích cho cả câu. Với trả lời ngắn thì từ dòng "=>" thứ hai.'),
    h('div',null,h('b',null,'Mức độ (tùy chọn): '),'ghi [M1] cơ bản, [M2] đọc hiểu, [M3] vận dụng ngay sau "Câu N." (ví dụ: Câu 5. [M2] nội dung…). Không ghi = Mức 1. Cách cũ * (= mức 2) và ** (= mức 3) vẫn dùng được.'),
    h('div',null,h('b',null,'Tiếng Anh: '),'Điền từ vào đoạn văn: viết đoạn có (1) ______, (2) ______, rồi mỗi chỗ trống một dòng "(1) a. … | *b. … | c. … | d. …". Chia dạng từ: thêm thẻ [WF] sau [M..], dòng "=> " đầu là đáp án. Viết lại câu: thẻ [RW], ngay dưới đề bài là dòng ">> We are ..." (câu mở đầu, app điền sẵn vào ô trả lời), dòng "=> " đầu là đáp án; nhiều cách đúng thì cách nhau " || ". Khi chấm không phân biệt hoa/thường, không cần dấu chấm cuối, thừa dấu cách vẫn nhận.'),
    h('div',null,'Quên dấu * ở đáp án? Bấm chọn đáp án ở phần xem trước, ứng dụng tự thêm * vào đề giúp bạn.'))));
  right.appendChild(h('h2',{style:'font-size:19px'},'3. Xem trước & kiểm tra'));right.appendChild(pvBox);
  m.appendChild(left);m.appendChild(right);$.appendChild(m);drawChips();pv()}

/* ===== Móc nối với online.js ===== */
OTN.app={
  setLibrary:function(c){COLS=c;
    try{var ks={};lessons().forEach(function(l){ks[l.key]=1});Object.keys(SEL).forEach(function(k){if(!ks[k])delete SEL[k]})}catch(e){}
    if(V.v==='home'||V.v==='subj')rr()},
  exportUser:function(){return UPL.length?JSON.stringify({format:'otn-bank',v:1,collections:UPL}):null},
  localList:function(){return UPL.slice()},
  importUser:function(t){try{var o=typeof t==='string'?JSON.parse(t):t;if(o&&Array.isArray(o.collections)){o.collections.filter(okCol).forEach(function(c){c.synced=false;UPL=UPL.filter(function(x){return x.id!==c.id&&x.path!==c.path});UPL.push(c)});saveUPL()}}catch(e){note('Không nhập được bài từ backup',String(e&&e.message||e))}if(V.v==='home'||V.v==='subj')rr()},
  usage:function(){var n=0;try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('otn2.')===0)n+=k.length+(localStorage.getItem(k)||'').length}}catch(e){}n*=2;return n<1048576?Math.round(n/1024)+' KB':(n/1048576).toFixed(1)+' MB'},
  clearLocal:function(kind){var onGit=function(c){return c.synced||COLS.some(function(x){return x.path&&x.path===c.path})};
    var done=function(t){saveUPL();if(V.v==='home'||V.v==='subj')rr();note('Đã xóa',t)};
    if(kind==='scores'){ask('Xóa điểm cũ?','Xóa toàn bộ điểm tốt nhất đã nhớ trên máy này.','Xóa',function(){HIST={};lw('hist',HIST);note('Đã xóa','Đã xóa điểm cũ.')})}
    else if(kind==='synced'){var n=UPL.filter(onGit).length;if(!n)return note('Không có gì để xóa','Chưa có bài nào trên máy mà GitHub đã có bản.');
      ask('Xóa '+n+' bài đã có trên GitHub?','Chỉ xóa bản lưu trên máy; bản trên GitHub vẫn còn và vẫn hiện trong danh sách.','Xóa',function(){UPL=UPL.filter(function(c){return !onGit(c)});SEL={};done('Đã xóa '+n+' bài khỏi bộ nhớ máy.')})}
    else{ask('Xóa TẤT CẢ '+UPL.length+' bài lưu trên máy?','Bài chưa lên GitHub sẽ mất vĩnh viễn. Hãy bấm "Xuất gói đưa lên GitHub" hoặc "Backup" trước. Bài trên GitHub không bị ảnh hưởng.','Xóa hết',function(){UPL=[];SEL={};done('Đã xóa mọi bài lưu trên máy.')})}},
  hasUser:function(){return false},
  busy:function(){return V.v==='quiz'||V.v==='up'},
  ask:ask
};
if(sessLoad()){render();window.scrollTo(0,sessY)}else render();
};
